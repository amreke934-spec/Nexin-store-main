name: Build Nexin Store Flutter APK

on:
  push:
    branches:
      - main
      - رئيسي
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          # العثور على المجلد الذي يحتوي على pubspec.yaml
          FLUTTER_DIR=$(find . -maxdepth 2 -name "pubspec.yaml" -exec dirname {} \;)
          echo "Flutter directory found at: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          
          flutter pub get
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=nexin_store
          fi
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexinStore-Android-Release-APK
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
