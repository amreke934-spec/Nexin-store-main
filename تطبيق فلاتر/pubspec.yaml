name: nexin_store
description: "متجر نيكسن - تطبيق شحن الألعاب والبطاقات الرقمية وخدمات الكاش (Nexin Store Mobile App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & Networking
  http: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Local Persistence
  shared_preferences: ^2.2.2

  # UI & Animations
  google_fonts: ^6.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Utilities & Helpers
  uuid: ^4.3.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
